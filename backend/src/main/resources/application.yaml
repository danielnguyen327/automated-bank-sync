spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health 

plaid:
  client-id: ${PLAID_CLIENT_ID:}
  secret: ${PLAID_SECRET:}
  environment: ${PLAID_ENV:sandbox}

ledgersync:
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}